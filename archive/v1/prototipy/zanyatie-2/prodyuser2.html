<title>Продюсер читает замысел</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Golos+Text:wght@400;600;700&display=swap">
<style>
/* Стол продюсера: сильное, находки, развилки кнопками, итоговые решения. Данные в объекте REVIEW. */
:root{
  --bg:#0d0b1a; --panel:#17142b; --line:#2f2a55; --ink:#f4f0ff; --muted:#a49cc9;
  --hot:#ffcf3a; --good:#45e39a; --warn:#ff9a4d; --dice:#ff7ad9;
  --display:'Unbounded',system-ui,sans-serif; --body:'Golos Text',system-ui,sans-serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);margin:0}
.wrap{max-width:820px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.brand{font:800 13px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--hot)}
h1{font:800 clamp(24px,5vw,36px)/1.1 var(--display);margin:0;text-wrap:balance}
.sub{margin:0;color:var(--muted)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.box h2{font:800 16px var(--display);margin:0}
.strong{border-color:var(--good)}
.strong h2{color:var(--good)}
.finding{display:flex;gap:12px;align-items:flex-start}
.finding b.n{flex:none;font:800 14px var(--display);color:var(--warn);width:24px}
.finding p{margin:0}
.finding small{display:block;color:var(--muted);font-size:13.5px}
.q{font-weight:700}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:#1f1b3a;border:2px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--ink);cursor:pointer;font:600 15px var(--body);display:flex;flex-direction:column;gap:3px}
.opt small{font-weight:400;color:var(--muted);font-size:13px}
.opt .rec{color:var(--hot);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.opt[aria-pressed="true"]{border-color:var(--hot);background:#2a2450}
.opt:focus-visible,.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
ol.dec{margin:0;padding-left:20px;display:grid;gap:6px}
ol.dec li span{color:var(--muted)}
pre{white-space:pre-wrap;background:#0d0b1a;border:1px solid var(--line);border-radius:10px;padding:12px;margin:0;font:13px/1.5 ui-monospace,Consolas,monospace}
.btn{align-self:flex-start;font:800 15px var(--display);border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:var(--hot);color:#1a1300}
.meter{font-size:13.5px;color:var(--muted)}
</style>

<div class="wrap">
  <div class="brand">Лаборатория игр · продюсер</div>
  <h1 id="title"></h1>
  <p class="sub">Продюсер читает замысел до программиста. Он ничего не переписывает за автора: показывает, где замысел спорит сам с собой, и предлагает развилки. Выбирать тебе.</p>
  <section class="box strong"><h2>Что сильное</h2><div id="strong"></div></section>
  <section class="box"><h2>Находки</h2><div id="finds" style="display:flex;flex-direction:column;gap:12px"></div></section>
  <div id="forks" style="display:flex;flex-direction:column;gap:16px"></div>
  <section class="box"><h2>Решения после продюсера</h2><ol class="dec" id="dec"></ol></section>
  <section class="box">
    <h2>Ответ учителю</h2>
    <div class="meter" id="meter"></div>
    <pre id="out"></pre>
    <button class="btn" id="copy" type="button">Скопировать выбор</button>
  </section>
</div>

<script>
const REVIEW = {
  title: 'Змейка-перевёртыш',
  strong: 'Одно правило, и оно меняет всю привычную змейку: каждые 10 секунд голова и хвост меняются местами. Чувство «новизна на поле» ты написал сам, и это правило его даёт.',
  finds: [
    ['Решение без кнопки', 'В «Г» есть кнопка B «особая способность», но в замысле нет ни одной способности. Кнопка без решения сбивает игрока.'],
    ['Выбор из другой игры', '«Атаковать или защищаться»: в змейке никого не атакуют. Игроку нужен выбор, который рождается из твоего правила.'],
    ['Честность без бота', '«Бот играет по тем же правилам», но бота в змейке нет. Честность здесь о другом: игрок должен знать, где окажется голова после разворота.'],
  ],
  forks: [
    { id: 'b', q: 'Что делает кнопка B?', opts: [
      ['Рывок', 'Автообмен каждые 10 с остаётся. B на секунду ускоряет змейку, перезарядка 4 с. Можно успеть к еде до разворота.', true],
      ['Разворот вручную', 'Автообмена нет. Голова и хвост меняются по кнопке B с перезарядкой 5 с. Правило становится выбором игрока.'],
      ['Кнопки B нет', 'Автообмен каждые 10 с, управление только 4 направления. Проще всего, всё решает момент.'],
    ] },
    { id: 'choice', q: 'Какой выбор игрок делает снова и снова?', opts: [
      ['Длинная или безопасная', 'Каждая еда даёт очки и удлиняет змейку, а чем она длиннее, тем опаснее разворот. Расти ради рекорда или держаться короткой?', true],
      ['Сейчас или после разворота', 'Еда у хвоста после разворота окажется у головы. Ползти к ней сейчас или подождать?'],
    ] },
  ],
  decisions: (pick) => [
    ['Чувство', 'радость и увлечение от новизны на поле'],
    ['Честность', 'за 2 секунды до разворота хвост мигает и тикает отсчёт: видно, где окажется голова и куда она поползёт'],
    ['Выбор', pick.choice === 0 ? 'расти ради рекорда или держаться короткой, чтобы разворот был безопасным' : 'ползти к еде сейчас или дождаться разворота, когда она окажется у головы'],
  ],
};
const $ = s => document.querySelector(s);
const pick = {};
$('#title').textContent = REVIEW.title;
$('#strong').innerHTML = `<p style="margin:0">${REVIEW.strong}</p>`;
$('#finds').innerHTML = REVIEW.finds.map((f, i) => `<div class="finding"><b class="n">${i + 1}</b><p>${f[0]}<small>${f[1]}</small></p></div>`).join('');
$('#forks').innerHTML = REVIEW.forks.map(f => `<section class="box"><h2>Развилка</h2><div class="q">${f.q}</div><div class="opts">${f.opts.map((o, i) => `<button class="opt" type="button" data-f="${f.id}" data-i="${i}" aria-pressed="false">${o[2] ? '<span class="rec">совет продюсера</span>' : ''}${o[0]}<small>${o[1]}</small></button>`).join('')}</div></section>`).join('');
document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
  pick[b.dataset.f] = +b.dataset.i;
  document.querySelectorAll(`.opt[data-f="${b.dataset.f}"]`).forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  try { const AC = window._ac || (window._ac = new AudioContext()); const o = AC.createOscillator(), g = AC.createGain(); o.type = 'triangle'; o.frequency.value = 660 + 220 * +b.dataset.i; g.gain.setValueAtTime(0.06, AC.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + 0.15); o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + 0.16); } catch (e) {}
  update();
});
function update() {
  const p = { choice: pick.choice ?? 0 };
  const dec = REVIEW.decisions(p);
  $('#dec').innerHTML = dec.map(d => `<li><b>${d[0]}:</b> <span>${d[1]}</span></li>`).join('');
  const done = REVIEW.forks.every(f => pick[f.id] != null);
  $('#meter').textContent = done ? 'Обе развилки выбраны, можно отправлять.' : 'Выбери вариант в каждой развилке.';
  $('#out').textContent = ['Продюсер · ' + REVIEW.title, ...REVIEW.forks.map(f => `${f.q} ${pick[f.id] != null ? f.opts[pick[f.id]][0] : '—'}`), ...dec.map(d => `${d[0]}: ${d[1]}`)].join('\n');
}
$('#copy').onclick = e => {
  const b = e.currentTarget, txt = $('#out').textContent;
  const sel = () => { const r = document.createRange(); r.selectNodeContents($('#out')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Выдели и скопируй'; };
  try { navigator.clipboard.writeText(txt).then(() => b.textContent = 'Скопировано, пришли в чат', sel); } catch (err) { sel(); }
};
update();
</script>
