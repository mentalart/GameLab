<title>Тетрадь занятия 3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Golos+Text:wght@400;600;700&display=swap">
<style>
/* Тетрадь урока 3: вкладки-чекпоинты, закрытые учителем показаны замком. Геймпад водит рамку по кнопкам. */
:root{
  --bg:#0d0b1a; --panel:#17142b; --raise:#1f1b3a; --line:#2f2a55; --ink:#f4f0ff; --muted:#a49cc9;
  --hot:#ffcf3a; --good:#45e39a; --bad:#ff5a6e; --dice:#ff7ad9;
  --m:#5cc8ff; --d:#ffcf3a; --a:#ff7ad9;
  --display:'Unbounded',system-ui,sans-serif; --body:'Golos Text',system-ui,sans-serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);margin:0}
.wrap{max-width:880px;margin:0 auto;padding-block:20px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.brand{font:800 13px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--hot)}
h1{font:800 clamp(24px,5vw,38px)/1.1 var(--display);margin:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:700 14px var(--body);background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.tab[aria-selected="true"]{color:#1a1300;background:var(--hot);border-color:var(--hot)}
.tab:disabled{cursor:not-allowed;opacity:.5}
.tab.done::after{content:" ✓";color:var(--good)}
.tab[aria-selected="true"].done::after{color:#1a1300}
button:focus-visible,textarea:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pf{outline:3px solid var(--hot)!important;outline-offset:2px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.box h2{font:800 17px var(--display);margin:0}
.box p{margin:0;color:var(--muted)}
.box p b{color:var(--ink)}
.lab{font-weight:700;font-size:14px}
.sub{font-size:13px;color:var(--muted);margin-top:-6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:8px 14px;font:600 14px var(--body);cursor:pointer;text-align:left}
.chip[aria-pressed="true"]{border-color:var(--hot);background:#2a2450}
.chip:disabled{opacity:.35;cursor:not-allowed}
.big{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.bc{background:var(--raise);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;font:600 15px var(--body)}
.bc small{font:400 13px/1.35 var(--body);color:var(--muted)}
.bc[aria-pressed="true"]{border-color:var(--hot);background:#2a2450}
.bc[aria-pressed="true"] b::after{content:"  ✓";color:var(--hot)}
.rowf{display:flex;gap:8px}
.rowf textarea{flex:1;min-width:0}
textarea{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;font:15px/1.4 var(--body);padding:9px 11px;resize:vertical;min-height:44px;box-sizing:border-box;width:100%}
textarea.dice{border-color:var(--dice);color:#ffd9f3}
.die{flex:none;width:48px;border-radius:10px;border:1px solid var(--dice);background:rgba(255,122,217,.1);font-size:22px;cursor:pointer;color:var(--ink)}
.tag{font-size:12px;color:var(--dice);min-height:1em}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0;font:13px/1.5 ui-monospace,Consolas,monospace}
.btn{align-self:flex-start;font:800 15px var(--display);border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:var(--hot);color:#1a1300;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
kbd{font:600 12px ui-monospace,Consolas,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--bg)}
/* лестница M D A */
.lad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lad>div{border-radius:12px;padding:10px;background:var(--raise);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.lad h3{margin:0;font:800 12px var(--display);letter-spacing:.08em}
.lad .m h3{color:var(--m)} .lad .d h3{color:var(--d)} .lad .a h3{color:var(--a)}
.lad .m{border-top:3px solid var(--m)} .lad .d{border-top:3px solid var(--d)} .lad .a{border-top:3px solid var(--a)}
.lad ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.lad small{color:var(--muted);font-size:12.5px}
/* сортировщик */
.hud{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.hud b{color:var(--ink)}
.card{font:800 clamp(18px,3.4vw,24px)/1.3 var(--display);text-align:center;padding:22px 12px;border:2px solid var(--line);border-radius:14px;background:var(--raise)}
.card.own{border-style:dashed}
.card.ok{border-color:var(--good)} .card.no{border-color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.opts{display:grid;gap:8px}
.opt{font:800 15px var(--display);color:var(--ink);background:var(--raise);border:2px solid var(--line);border-radius:14px;padding:14px 6px;cursor:pointer}
.opt:hover{border-color:var(--hot)}
.why{text-align:center;font-size:15px;min-height:1.5em}
.rule{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:14px;display:grid;gap:3px}
.rule b{font-family:var(--display);font-size:12px}
/* шаги замысла */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{font:700 13px var(--body);border-radius:999px;padding:6px 12px;border:1px solid var(--line);color:var(--muted);background:var(--bg);cursor:pointer}
.step[aria-current="step"]{border-color:var(--hot);color:var(--ink)}
.step.ok{color:var(--good);border-color:var(--good)}
.meter{font-size:13px;color:var(--muted)}
.meter b{color:var(--ink)}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.desc{font-size:13.5px;color:var(--muted);min-height:1.3em}
/* фабрика замысла: живые карты, сила, шкалы */
.axes{display:flex;flex-wrap:wrap;gap:6px}
.axes span{font-size:12.5px;color:var(--muted);border:1px solid;border-radius:10px;padding:5px 9px}
.fx{font:700 13px var(--body);display:flex;gap:8px;flex-wrap:wrap;color:var(--ink);margin-top:2px}
.cards3{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.c3 canvas{width:100%;height:auto;aspect-ratio:16/9;border-radius:9px;display:block;margin-bottom:5px;background:#141133}
.powl{font-size:14px;color:var(--muted)} .powl b{color:var(--ink)}
.pow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pw{background:var(--raise);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;text-align:left;font:800 14px var(--display)}
.pw small{font:400 12.5px/1.3 var(--body);color:var(--muted)}
.pw canvas{width:100%;height:auto;aspect-ratio:16/9;border-radius:8px;display:block;margin-bottom:5px;background:#141133}
.pw[aria-pressed="true"]{border-color:var(--hot);background:#2a2450}
.sum{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.sum b{color:var(--ink)}
.bigsim{width:100%;height:auto;aspect-ratio:16/9;border-radius:12px;display:block;background:#141133}
.bars{display:flex;flex-direction:column;gap:8px}
.barrow{display:grid;grid-template-columns:190px 1fr;gap:10px;align-items:center}
.bl{display:flex;flex-direction:column;font-size:14px} .bl small{font-size:12px;color:var(--muted);line-height:1.3}
.lvs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.lv{font:700 13px var(--body);color:var(--muted);background:var(--bg);border:2px solid var(--line);border-radius:9px;padding:9px 2px;cursor:pointer;min-width:0}
.lv.tg{border-style:dashed;border-color:var(--ac)}
.lv[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#140f00;border-style:solid}
.pwt{display:flex;flex-direction:column;gap:2px}
@media (max-width:620px){.barrow{grid-template-columns:1fr;gap:4px}.cards3{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{padding:8px}.pow{grid-template-columns:1fr}.pw{flex-direction:row;align-items:center;gap:10px;padding:8px}.pw canvas{width:56%;flex:none;margin:0}}
.pad{position:fixed;left:0;right:0;bottom:0;background:rgba(13,11,26,.94);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));font-size:13px;color:var(--muted);text-align:center;z-index:5}
@media (max-width:620px){.lad{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.card.no{animation:none}}
</style>

<div class="wrap">
  <div class="brand">Лаборатория игр · занятие 3</div>
  <h1>Механика, динамика, эстетика</h1>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="panel"></div>
</div>
<div class="pad" id="padBar"></div>

<script>
const OPEN = 5; // сколько вкладок открыл учитель
const GAME_URL = 'https://claude.ai/artifact/KC8cpEWaSgx5KwrBtf2TDr'; // 3D-игра ученика «Башня из облаков»
const SNAKE_URL = 'https://claude.ai/artifact/D135NiygvZQFLcehzpdXRo';
const TABS = ['0 · Вход', '1 · Лестница', '2 · Замысел', '3 · Твоя 3D-игра', '4 · Миссия', '5 · Чужие глаза'];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pick = a => a[Math.floor(Math.random() * a.length)];
let AC = null;
function beep(f, d = 0.09, type = 'triangle', v = 0.07, delay = 0) { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + 0.02); } catch (e) {} }
const win = () => [523, 659, 784, 1046].forEach((f, j) => beep(f, 0.15, 'triangle', 0.08, j * 0.08));

/* ---------- состояние, сохраняется в браузере ученика ---------- */
const st = {
  tab: 0,
  did: [], felt: [], layer: -1,          // вход
  sortI: 0, sortOk: 0, sortAns: [], sortOrder: null, plI: 0, plOk: 0, plAns: [], plOrder: null, snakePl: '', // лестница
  step: 0, aim: -1, goal: -1, verb: -1, threat: -1, pred: [], pow: { goal: 1, verb: 1, threat: 1 }, bars: [-1, -1, -1, -1, -1], // замысел
  f: {},                                 // текстовые поля {v, d}
};
try { Object.assign(st, JSON.parse(localStorage.getItem('lab-t3n') || '{}')); } catch (e) {}
function save() { try { localStorage.setItem('lab-t3n', JSON.stringify(st)); } catch (e) {} }

/* ---------- вкладки ---------- */
function tabDone(i) { return [st.layer === 0, st.plI >= PL_CARDS.length, !!promptReady()][i] || false; }
function tabs() {
  $('#tabs').innerHTML = TABS.map((t, i) => `<button class="tab${tabDone(i) ? ' done' : ''}" role="tab" type="button" data-i="${i}" aria-selected="${i === st.tab}" ${i >= OPEN ? 'disabled title="Откроет учитель"' : ''}>${i >= OPEN ? '🔒 ' : ''}${t}</button>`).join('');
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => go(+b.dataset.i));
}
function go(i) { if (i < 0 || i >= OPEN) return; st.tab = i; save(); tabs(); render(); pf = 0; padFocus(); scrollTo(0, 0); }
function render() { [cp0, cp1, cp2, cp3, cp4][st.tab](); padBar(); }

/* ---------- общие кусочки ---------- */
function chipRow(el, list, key, max, pairs, cb) {
  const sel = st[key];
  el.innerHTML = list.map((x, i) => { const off = pairs && pairs[i] != null && sel.includes(pairs[i]); return `<button class="chip" type="button" data-i="${i}" aria-pressed="${sel.includes(i)}">${esc(x)}</button>`; }).join('');
  el.dataset.g = key;
  el.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    const i = +b.dataset.i, k = sel.indexOf(i);
    if (k >= 0) sel.splice(k, 1); else { if (pairs && pairs[i] != null) { const j = sel.indexOf(pairs[i]); if (j >= 0) sel.splice(j, 1); } sel.push(i); if (sel.length > max) sel.shift(); }
    beep(560 + i * 30); save(); chipRow(el, list, key, max, pairs, cb); cb && cb();
  });
}
function field(box, k, label, deck, sub) {
  const w = document.createElement('div');
  w.innerHTML = `<div class="lab">${label}</div>${sub ? `<div class="sub">${sub}</div>` : ''}<div class="rowf"><textarea rows="1" aria-label="${esc(label)}"></textarea><button class="die" type="button" aria-label="Кубик: ${esc(label)}">🎲</button></div><div class="tag"></div>`;
  box.appendChild(w);
  const ta = w.querySelector('textarea'), tg = w.querySelector('.tag');
  const sync = () => { const v = st.f[k] || { v: '', d: false }; if (ta.value !== v.v) ta.value = v.v; ta.classList.toggle('dice', !!v.d); tg.textContent = v.d ? '[кубик] поправь пару слов, и вариант станет твоим' : ''; ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px'; };
  ta.oninput = () => { st.f[k] = { v: ta.value, d: false }; sync(); save(); upd(); };
  w.querySelector('.die').onclick = () => { const d = typeof deck === 'function' ? deck() : deck; let v, n = 0; do { v = pick(d); } while (st.f[k] && v === st.f[k].v && ++n < 12); st.f[k] = { v, d: true }; sync(); beep(820, 0.06, 'square', 0.05); save(); upd(); };
  sync();
}
const fv = k => (st.f[k] && st.f[k].v || '').trim();
const ft = k => fv(k) ? fv(k) + (st.f[k].d ? ' [кубик]' : '') : '…';
function answerBox(title, btn) {
  return `<section class="box"><h2>${title}</h2><pre id="out"></pre><div class="row"><button class="btn" id="copy" type="button">${btn}</button></div></section>`;
}
function copyOut(e) {
  const b = e.currentTarget, txt = $('#out').textContent;
  const sel = () => { const r = document.createRange(); r.selectNodeContents($('#out')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Выдели и скопируй'; };
  try { navigator.clipboard.writeText(txt).then(() => { b.textContent = 'Скопировано, пришли в чат'; win(); }, sel); } catch (err) { sel(); }
}
let upd = () => {};

/* ========== 0 · ВХОД ========== */
const SNAKE_M = ['Каждые 10 секунд голова и хвост меняются местами', 'За 2 секунды до разворота хвост мигает и тикает отсчёт', 'У стены змейка сама поворачивает', 'B — рывок на 1 секунду, перезарядка 4 секунды', 'Каждые 15 секунд змейка ползёт быстрее', 'Хычин: +1 к длине, очки растут с длиной'];
const DID = ['Держал змейку короткой, чтобы разворот был не страшен', 'Перед разворотом уводил хвост в пустое место', 'Гнался за хычином напролом', 'Ждал разворота и только потом шёл за хычином', 'Жал рывок, чтобы успеть к хычину', 'Жал рывок, чтобы спастись', 'Кружил вдоль стен', 'Растил змейку ради рекорда'];
const FELT = ['Азарт', 'Паника перед разворотом', 'Радость от неожиданности', 'Гордость за рекорд', 'Злость на себя', 'Спокойствие', 'Скука', 'Любопытство'];
const LAYER = ['M · правила', 'D · что ты делал', 'A · что ты чувствовал'];
function cp0() {
  $('#panel').innerHTML = `
  <section class="box">
    <h2>Сыграй одну партию в свою змейку</h2>
    <p>Это твоя «Змейка-перевёртыш». Сыграй одну партию и вернись сюда. Смотри не на очки, а на себя: что ты делал и что чувствовал.</p>
    <div class="row"><a class="btn" href="${SNAKE_URL}" target="_blank" rel="noopener">Открыть змейку</a></div>
  </section>
  <section class="box">
    <h2>Что ты делал?</h2><p>Отметь до трёх. Не что было в игре, а что делал именно ты.</p><div class="chips" id="did"></div>
    <h2>Что ты чувствовал?</h2><p>Отметь до двух.</p><div class="chips" id="felt"></div>
  </section>
  <section class="box" id="ladBox"></section>
  ${answerBox('Ответ учителю', 'Скопировать ответ')}`;
  chipRow($('#did'), DID, 'did', 3, null, lad0);
  chipRow($('#felt'), FELT, 'felt', 2, null, lad0);
  $('#copy').onclick = copyOut; lad0();
}
function lad0() {
  const box = $('#ladBox'), ready = st.did.length && st.felt.length;
  if (!ready) { box.innerHTML = '<h2>Три слоя твоей игры</h2><p>Отметь, что делал и что чувствовал, и здесь сложится твоя змейка по слоям.</p>'; out0(); return; }
  box.innerHTML = `<h2>Три слоя твоей игры</h2>
    <div class="lad">
      <div class="m"><h3>M · МЕХАНИКА</h3><ul>${SNAKE_M.map(x => `<li>${x}</li>`).join('')}</ul><small>Правила. Их написал дизайнер.</small></div>
      <div class="d"><h3>D · ДИНАМИКА</h3><ul>${st.did.map(i => `<li>${DID[i]}</li>`).join('')}</ul><small>Что ты делал из-за этих правил.</small></div>
      <div class="a"><h3>A · ЭСТЕТИКА</h3><ul>${st.felt.map(i => `<li>${FELT[i]}</li>`).join('')}</ul><small>Что ты почувствовал.</small></div>
    </div>
    <div class="lab">Ты дизайнер этой игры. Какой слой ты можешь поменять напрямую, ручкой?</div>
    <div class="opts" id="layer" data-g="layer" style="grid-template-columns:repeat(3,minmax(0,1fr))">${LAYER.map((x, i) => `<button class="opt" type="button" data-i="${i}">${x}</button>`).join('')}</div>
    <div class="why" id="layerWhy"></div>`;
  const why = () => { $('#layerWhy').innerHTML = st.layer < 0 ? '' : st.layer === 0 ? '<b style="color:var(--good)">Верно.</b> Ручками меняются только правила. Как ты будешь играть и что почувствуешь, дизайнер не задаёт: это вырастает из правил у игрока. Весь урок про то, как из правил вырастить нужное чувство.' : `<b style="color:var(--bad)">Нет.</b> ${st.layer === 1 ? 'Ручки «держи змейку короткой» нет. Ты сам так решил, потому что правило разворота сделало длинную змейку опасной.' : 'Ручки «паника» нет. Паника пришла из отсчёта и разворота.'} Попробуй ещё.`; };
  box.querySelectorAll('#layer .opt').forEach(b => b.onclick = () => { st.layer = +b.dataset.i; if (st.layer === 0) win(); else beep(200, 0.25, 'sawtooth', 0.06); save(); why(); tabs(); out0(); });
  why(); out0();
}
function out0() {
  if (!$('#out')) return;
  $('#out').textContent = ['Занятие 3 · вход', `Делал: ${st.did.map(i => DID[i]).join('; ') || '—'}`, `Чувствовал: ${st.felt.map(i => FELT[i]).join(', ') || '—'}`, `Что меняет дизайнер напрямую: ${st.layer < 0 ? '—' : LAYER[st.layer] + (st.layer === 0 ? ' (верно)' : ' (ошибка)')}`].join('\n');
}

/* ========== 1 · ЛЕСТНИЦА ========== */
const MDA3 = ['M · механика', 'D · динамика', 'A · эстетика'];
function mdaCards() {
  const own = [];
  if (st.did.length) own.push([DID[st.did[0]], 1, 'Это ты делал сам, из-за правил. Динамика.', 1]);

Герой: ${ft('hero')}. Мир: ${ft('world')}. Герой собирает, ловит или спасает: ${ft('item')}.
Механика, три карты с силой: цель ${c('goal')}. Кнопка A: ${c('verb')}. Угроза: ${c('threat')}.
Предсказание шкал опыта (0 нет, 1 мало, 2 средне, 3 много, 4 очень): ${AXES.map((a, r) => `${a.n} ${st.bars[r] >= 0 ? st.bars[r] : '…'}`).join(', ')}.
Гипотеза: ${ft('why')}.
Решения: 1) ${ft('d1')}. 2) ${ft('d2')}. 3) ${ft('d3')}.

Как собрать: яркая детальная лоупольная 3D-игра в браузере. Модели героя, мира, целей и угрозы по словам выше; палитру, музыку и облик подобрать под мир. Плоские грани, насыщенные цвета, мягкие тени, туман и свет под настроение мира, частицы, анимации, звук. Камера сверху под углом. Раунд около минуты. Клавиатура и геймпад, подсказки кнопок в меню. Ручки геймдизайнера (Tab): три карты и сила каждой (слабо, средне, сильно), сила меняет игру в разы. Перед стартом экран с тремя решениями, а если правило поменялось, крупно показать, что именно. Музыка и края экрана реагируют на близость опасности. Игра меряет те же пять шкал и после партии показывает их рядом с предсказанием и прошлой партией, плюс «пульс партии»: график напряжения по секундам.`;
}

/* ---------- клавиатура ---------- */
addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA') return;
  if (st.tab === 1 && sortActive) { const n = parseInt(e.key, 10); if (n >= 1 && n <= sortActive.n && document.getElementById(sortActive.id).querySelector('.opt')) { sortActive.choose(n - 1); } }
});

/* ---------- геймпад: рамка ходит по кнопкам ---------- */
let pf = 0, padOn = false, prev = [], prevAx = [0, 0], rep = 0;
function focusables() { return [...document.querySelectorAll('#panel button:not(:disabled), #panel a.btn, #panel textarea')].filter(el => el.offsetParent !== null); }
function padFocus() {
  document.querySelectorAll('.pf').forEach(x => x.classList.remove('pf'));
  if (!padOn) return;
  const L = focusables(); if (!L.length) return; pf = Math.max(0, Math.min(L.length - 1, pf)); L[pf].classList.add('pf');
}
function grp(el) { const g = el.closest('[data-g]'); return g || el; }
function move(dx, dy) {
  const L = focusables(); if (!L.length) return;
  if (dx) pf = (pf + dx + L.length) % L.length;
  if (dy) { const g = grp(L[pf]); let i = pf; do { i += dy; } while (i >= 0 && i < L.length && grp(L[i]) === g); if (i >= 0 && i < L.length) { const g2 = grp(L[i]); if (dy < 0) while (i > 0 && grp(L[i - 1]) === g2) i--; pf = i; } }
  padFocus(); const el = L[pf]; el && el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); beep(500, 0.03, 'square', 0.03);
}
function rumble() { try { const gp = [...navigator.getGamepads()].find(Boolean); gp && gp.vibrationActuator && gp.vibrationActuator.playEffect('dual-rumble', { duration: 180, strongMagnitude: 0.7, weakMagnitude: 0.4 }); } catch (e) {} }
function padBar() {
  $('#padBar').innerHTML = padOn
    ? '🎮 <kbd>↑ ↓</kbd> ряд · <kbd>← →</kbd> выбор · <kbd>A</kbd> нажать · <kbd>X</kbd> кубик · <kbd>B</kbd> назад · <kbd>Start</kbd> дальше · <kbd>LB</kbd> <kbd>RB</kbd> вкладки'
    : '⌨️ <kbd>Tab</kbd> по кнопкам · <kbd>Enter</kbd> нажать · в лестнице <kbd>1</kbd>–<kbd>8</kbd> · можно подключить геймпад';
}
(function poll() {
  try {
    const gp = navigator.getGamepads && [...navigator.getGamepads()].find(Boolean);
    if (gp) {
      if (!padOn) { padOn = true; padBar(); padFocus(); }
      const b = gp.buttons.map(x => !!(x && x.pressed)), dn = i => b[i] && !prev[i];
      const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
      const sx = ax > 0.55 ? 1 : ax < -0.55 ? -1 : 0, sy = ay > 0.55 ? 1 : ay < -0.55 ? -1 : 0;
      const nx = sx !== prevAx[0] ? sx : 0, ny = sy !== prevAx[1] ? sy : 0; prevAx = [sx, sy];
      if (dn(14) || nx < 0) move(-1, 0); if (dn(15) || nx > 0) move(1, 0);
      if (dn(12) || ny < 0) move(0, -1); if (dn(13) || ny > 0) move(0, 1);
      if (dn(0)) { const el = focusables()[pf]; if (el) { if (el.tagName === 'TEXTAREA') { const d = el.parentElement.querySelector('.die'); d && d.click(); } else el.click(); setTimeout(padFocus, 30); } }
      if (dn(2)) { const el = focusables()[pf], d = el && el.closest('.rowf') && el.closest('.rowf').querySelector('.die'); if (d) { d.click(); setTimeout(padFocus, 30); } }
      if (dn(1) && st.tab === 2 && $('#back')) { $('#back').click(); setTimeout(padFocus, 30); }
      if (dn(9) && st.tab === 2 && $('#next')) { $('#next').click(); setTimeout(padFocus, 30); }
      if (dn(4)) go(st.tab - 1); if (dn(5)) go(st.tab + 1);
      prev = b;
    }
  } catch (e) {}
  requestAnimationFrame(poll);
})();
tabs(); render();
</script>
