<!doctype html>
<html lang="ru" data-role="teacher">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проектор · Лаборатория игр</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="pj-body">
<header class="top">
  <div class="logo"><i></i> Лаборатория игр</div>
  <div class="muted small" id="pjClass"></div>
  <div class="tabs pj-tabs" role="tablist">
    <button type="button" class="on" data-tab="lesson">Урок</button>
    <button type="button" data-tab="demo" id="demoTab" hidden>Вау-старт</button>
    <button type="button" data-tab="poll" id="pollTab">Ответы класса</button>
    <button type="button" data-tab="pair" id="pairTab" hidden>Спрятанная механика рядом</button>
    <button type="button" data-tab="day">Мир дня</button>
    <button type="button" data-tab="final" id="finalTab">Финал</button>
    <button type="button" data-tab="cup" id="cupTab" hidden>Выставка и турнир</button>
    <button type="button" data-tab="m7" id="m7Tab" hidden>Вместе</button>
  </div>
  <div class="who"><button class="btn ghost small" id="pjFull" type="button">⛶ Во весь экран</button></div>
</header>
<main class="pj">
  <section id="pj-lesson" class="pj-lesson"></section>
  <section id="pj-demo" class="pj-demo" hidden></section>
  <section id="pj-poll" class="pj-poll" hidden></section>
  <section id="pj-pair" class="pj-pair" hidden></section>
  <section id="pj-day" hidden></section>
  <section id="pj-final" class="pj-final" hidden></section>
  <section id="pj-cup" class="pj-cup" hidden></section>
  <section id="pj-m7" class="pj-m7 stack" hidden></section>
</main>
<script src="/common.js"></script>
<script src="/games.js"></script>
<script src="/opory.js"></script>
<script src="/m7-pult.js"></script>
<script src="/projector.js"></script>
</body>
</html>
