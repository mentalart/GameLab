# Скачивает закреплённую версию Babylon.js, загрузчиков и физики Havok
# в portal/engine/vendor/ и коммитит в main. Запуск вручную: вкладка Actions.
name: Babylon.js в портал

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия babylonjs (пусто — последняя стабильная)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Скачать пакеты и разложить файлы
        env:
          WANT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          V="${WANT:-$(npm view babylonjs version)}"
          HV="$(npm view @babylonjs/havok version)"
          echo "babylonjs $V, @babylonjs/havok $HV"
          OUT="$GITHUB_WORKSPACE/portal/engine/vendor"
          rm -rf "$OUT"; mkdir -p "$OUT/babylon" "$OUT/loaders" "$OUT/havok"
          W="$(mktemp -d)"; cd "$W"
          get() { mkdir -p "$2"; f="$(npm pack "$1" --silent)"; tar -xzf "$f" -C "$2"; }
          get "babylonjs@$V" b
          get "babylonjs-loaders@$V" l
          get "@babylonjs/havok@$HV" h
          {
            echo "babylonjs $V"; echo "babylonjs-loaders $V"; echo "@babylonjs/havok $HV"
            echo "Скачано из npm $(date -u +%Y-%m-%d) workflow vendor-babylon.yml"
          } > "$OUT/VERSIONS.txt"
          for d in b l h; do echo "== $d"; (cd "$d/package" && find . -type f -printf '%s\t%p\n' | sort -k2); done > "$OUT/MANIFEST.txt"
          cp b/package/babylon.js "$OUT/babylon/"
          cp b/package/package.json "$OUT/babylon/"
          find b/package -maxdepth 1 -name '*.d.ts' -exec cp {} "$OUT/babylon/" \;
          if [ -f l/package/babylonjs.loaders.min.js ]; then cp l/package/babylonjs.loaders.min.js "$OUT/loaders/"; else cp l/package/babylonjs.loaders.js "$OUT/loaders/"; fi
          cp l/package/package.json "$OUT/loaders/"
          find h/package -name 'HavokPhysics_umd.js' -exec cp {} "$OUT/havok/" \;
          find h/package -name 'HavokPhysics.wasm' | head -1 | xargs -I{} cp {} "$OUT/havok/"
          cp h/package/package.json "$OUT/havok/"
          for d in b l h; do find "$d/package" -maxdepth 1 -iname '*licen*' -exec cp {} "$OUT/$( [ $d = b ] && echo babylon || ([ $d = l ] && echo loaders || echo havok))/" \; ; done
          ls -laR "$OUT"
      - name: Коммит в main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal/engine/vendor
          if git diff --cached --quiet; then echo "Без изменений"; exit 0; fi
          git commit -m "Babylon.js и Havok в portal/engine/vendor ($(head -1 portal/engine/vendor/VERSIONS.txt))"
          git pull --rebase origin main
          git push origin HEAD:main
